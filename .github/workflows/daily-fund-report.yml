name: Daily Fund Report

on:
  push:
    branches:
      - main
  schedule:
    # 08:00 Beijing time, Monday-Friday. GitHub cron uses UTC.
    - cron: "0 0 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-fund-report
  cancel-in-progress: false

jobs:
  update-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update fund report
        run: python scripts/update_fund_report.py

      - name: Commit report changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update daily fund report"
          file_pattern: "data/history.json report.html docs/index.html"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
